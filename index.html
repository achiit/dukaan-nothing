<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>ज़ॉम्बी सर्वाइवल वेब गेम</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        canvas {
            background-color: #333;
            display: block;
            margin: 0 auto;
            border: 2px solid #fff;
        }
        #scoreBoard {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const scoreElement = document.getElementById("score");
        let score = 0;

        // प्लेयर (बीच में स्नाइपर/शूटर)
        class Player {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // गोली (Bullet)
        class Projectile {
            constructor(x, y, radius, color, velocity) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.velocity = velocity;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
        }

        // दुश्मन (Zombie)
        class Enemy {
            constructor(x, y, radius, color, velocity) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.velocity = velocity;
            }
            draw() {
                ctx.beginPath();
                ctx.rect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
        }

        const x = canvas.width / 2;
        const y = canvas.height / 2;
        let player = new Player(x, y, 15, 'cyan');
        let projectiles = [];
        let enemies = [];
        let animationId;

        // माउस क्लिक करने पर गोली चलना
        window.addEventListener('click', (event) => {
            const angle = Math.atan2(event.clientY - y, event.clientX - x);
            const velocity = { x: Math.cos(angle) * 7, y: Math.sin(angle) * 7 };
            projectiles.push(new Projectile(x, y, 5, 'yellow', velocity));
        });

        // दुश्मन पैदा करना (Waves)
        function spawnEnemies() {
            setInterval(() => {
                const radius = Math.random() * (20 - 10) + 10;
                let enemyX, enemyY;

                if (Math.random() < 0.5) {
                    enemyX = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
                    enemyY = Math.random() * canvas.height;
                } else {
                    enemyX = Math.random() * canvas.width;
                    enemyY = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
                }

                const angle = Math.atan2(y - enemyY, x - enemyX);
                const velocity = { x: Math.cos(angle) * 2, y: Math.sin(angle) * 2 };
                enemies.push(new Enemy(enemyX, enemyY, radius, 'red', velocity));
            }, 1000);
        }

        // गेम लूप
        function animate() {
            animationId = requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(51, 51, 51, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            player.draw();

            projectiles.forEach((projectile, index) => {
                projectile.update();
                if (projectile.x - projectile.radius < 0 || projectile.x - projectile.radius > canvas.width || 
                    projectile.y - projectile.radius < 0 || projectile.y - projectile.radius > canvas.height) {
                    setTimeout(() => { projectiles.splice(index, 1); }, 0);
                }
            });

            enemies.forEach((enemy, index) => {
                enemy.update();

                const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (dist - enemy.radius - player.radius < 1) {
                    cancelAnimationFrame(animationId);
                    alert("Game Over! Your Score: " + score);
                    window.location.reload();
                }

                projectiles.forEach((projectile, projectileIndex) => {
                    const dist = Math.hypot(projectile.x - enemy.x, projectile.y - enemy.y);
                    if (dist - enemy.radius - projectile.radius < 1) {
                        setTimeout(() => {
                            enemies.splice(index, 1);
                            projectiles.splice(projectileIndex, 1);
                            score += 10;
                            scoreElement.innerHTML = score;
                        }, 0);
                    }
                });
            });
        }

        animate();
        spawnEnemies();
    </script>
</body>
</html>
